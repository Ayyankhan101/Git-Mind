services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8001"
      - "80:80"
    env_file:
      - backend/.env
    volumes:
      - gitmind_chroma:/app/.chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gitmind_chroma: