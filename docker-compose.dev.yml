services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    ports:
      - "8002:8001"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - gitmind_chroma:/app/.chroma
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3002:3000"
    environment:
      - REACT_APP_API_BASE=http://localhost:8002
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=3002
    command: sh -c "npm install && npm start"
    depends_on:
      - backend

volumes:
  gitmind_chroma: