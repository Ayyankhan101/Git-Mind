services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    ports:
      - "8002:8001"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - gitmind_chroma:/app/.chroma
      - chroma_model_cache:/root/.cache/chroma
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3002:3000"
    environment:
      - REACT_APP_API_BASE=http://localhost:8002
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=3002
    command: sh -c "npm ci --legacy-peer-deps && npm start"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gitmind_chroma:
  chroma_model_cache: