name: GitMind Monitor

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday 8am UTC
  workflow_dispatch:
    inputs:
      slack_webhook_url:
        description: 'Slack webhook URL for alerts (optional, uses secret if empty)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Run analysis + compare
        id: monitor
        env:
          GITMIND_API_URL: ${{ secrets.GITMIND_API_URL }}
          GITMIND_TOKEN: ${{ secrets.GITMIND_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url || secrets.SLACK_WEBHOOK_URL }}
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          REPO_NAME="${{ github.repository }}"

          # Get previous analysis
          PREV=$(curl -sf "$GITMIND_API_URL/analysis/previous?repo_url=$REPO_URL" \
            -H "X-GH-Token: $GITMIND_TOKEN" || echo '{"error":"none"}')

          # Trigger new analysis
          RESPONSE=$(curl -sf -X POST "$GITMIND_API_URL/analyze" \
            -H "Content-Type: application/json" \
            -H "X-GH-Token: $GITMIND_TOKEN" \
            -d "{\"repo_url\": \"$REPO_URL\", \"gh_token\": \"$GITMIND_TOKEN\"}" || echo '{"error":"request failed"}')

          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            echo "::warning::Analysis trigger failed: $(echo "$RESPONSE" | jq -r '.error')"
            exit 0
          fi

          # Poll for completion
          CACHED=$(echo "$RESPONSE" | jq -r '.cached // false')
          if [ "$CACHED" != "true" ]; then
            TASK_ID=$(echo "$RESPONSE" | jq -r '.task_id')
            SESSION_ID=""

            for i in $(seq 1 60); do
              TASK=$(curl -sf "$GITMIND_API_URL/task/$TASK_ID" || echo '{"status":"pending"}')
              STATUS=$(echo "$TASK" | jq -r '.status')

              if [ "$STATUS" = "completed" ]; then
                SESSION_ID=$(echo "$TASK" | jq -r '.result.session_id')
                break
              elif [ "$STATUS" = "failed" ]; then
                echo "::warning::Analysis failed: $(echo "$TASK" | jq -r '.error')"
                exit 0
              fi
              sleep 5
            done
          else
            SESSION_ID=$(echo "$RESPONSE" | jq -r '.session_id')
          fi

          if [ -z "$SESSION_ID" ]; then
            echo "::warning::Analysis timed out"
            exit 0
          fi

          # Get results
          CURR=$(curl -sf "$GITMIND_API_URL/analysis/$SESSION_ID" -H "X-GH-Token: $GITMIND_TOKEN" || echo '{}')

          # Compare
          PREV_SCORE=$(echo "$PREV" | jq -r '.health.score // 0')
          CURR_SCORE=$(echo "$CURR" | jq -r '.health.score // 0')
          SCORE_DIFF=$((CURR_SCORE - PREV_SCORE))

          PREV_SEC=$(echo "$PREV" | jq -r '.security_findings | length // 0')
          CURR_SEC=$(echo "$CURR" | jq -r '.security_findings | length // 0')
          NEW_FINDINGS=$((CURR_SEC - PREV_SEC))

          PREV_CVE=$(echo "$PREV" | jq -r '.cve_findings | length // 0')
          CURR_CVE=$(echo "$CURR" | jq -r '.cve_findings | length // 0')
          NEW_CVES=$((CURR_CVE - PREV_CVE))

          echo "score_diff=$SCORE_DIFF" >> $GITHUB_OUTPUT
          echo "new_findings=$NEW_FINDINGS" >> $GITHUB_OUTPUT
          echo "new_cves=$NEW_CVES" >> $GITHUB_OUTPUT
          echo "curr_score=$CURR_SCORE" >> $GITHUB_OUTPUT
          echo "prev_score=$PREV_SCORE" >> $GITHUB_OUTPUT
          echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT

          # Determine if significant
          SIGNIFICANT=false
          if [ "$SCORE_DIFF" -lt -5 ]; then SIGNIFICANT=true; fi
          if [ "$NEW_FINDINGS" -gt 0 ]; then SIGNIFICANT=true; fi
          if [ "$NEW_CVES" -gt 0 ]; then SIGNIFICANT=true; fi
          echo "significant=$SIGNIFICANT" >> $GITHUB_OUTPUT

      - name: Send Slack alert
        if: steps.monitor.outputs.significant == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url || secrets.SLACK_WEBHOOK_URL }}
          SCORE_DIFF: ${{ steps.monitor.outputs.score_diff }}
          NEW_FINDINGS: ${{ steps.monitor.outputs.new_findings }}
          NEW_CVES: ${{ steps.monitor.outputs.new_cves }}
          CURR_SCORE: ${{ steps.monitor.outputs.curr_score }}
          PREV_SCORE: ${{ steps.monitor.outputs.prev_score }}
          SESSION_ID: ${{ steps.monitor.outputs.session_id }}
          REPO_NAME: ${{ github.repository }}
        run: |
          DASHBOARD_URL="https://gitmind-peach.vercel.app/?share=$SESSION_ID"
          MSG="⚠️ *GitMind Alert: $REPO_NAME*\n"
          MSG+="Health score: $PREV_SCORE → $CURR_SCORE ($SCORE_DIFF)\n"
          [ "$NEW_FINDINGS" -gt 0 ] && MSG+="New security findings: +$NEW_FINDINGS\n"
          [ "$NEW_CVES" -gt 0 ] && MSG+="New CVEs: +$NEW_CVES\n"
          MSG+="<$DASHBOARD_URL|View report>"

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"$MSG\"}"

      - name: Create GitHub issue
        if: steps.monitor.outputs.significant == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORE_DIFF: ${{ steps.monitor.outputs.score_diff }}
          NEW_FINDINGS: ${{ steps.monitor.outputs.new_findings }}
          NEW_CVES: ${{ steps.monitor.outputs.new_cves }}
          CURR_SCORE: ${{ steps.monitor.outputs.curr_score }}
          PREV_SCORE: ${{ steps.monitor.outputs.prev_score }}
          SESSION_ID: ${{ steps.monitor.outputs.session_id }}
        run: |
          DASHBOARD_URL="https://gitmind-peach.vercel.app/?share=$SESSION_ID"

          BODY="## ⚠️ GitMind Weekly Monitor Alert\n\n"
          BODY+="| Metric | Previous | Current | Delta |\n"
          BODY+="|--------|----------|---------|-------|\n"
          BODY+="| Health Score | $PREV_SCORE | $CURR_SCORE | $SCORE_DIFF |\n"
          BODY+="| Security Findings | - | - | +$NEW_FINDINGS |\n"
          BODY+="| CVE Findings | - | - | +$NEW_CVES |\n\n"
          BODY+="[View full report]($DASHBOARD_URL)\n\n"
          BODY+="---\n*Generated by GitMind Monitor*"

          gh issue create \
            --title "⚠️ GitMind Monitor: Changes detected ($SCORE_DIFF score delta)" \
            --body "$BODY" \
            --label "gitmind,security" \
            2>/dev/null || echo "Issue creation skipped (label may not exist)"
