name: GitMind Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitMind analysis
        id: analyze
        env:
          GITMIND_API_URL: ${{ secrets.GITMIND_API_URL }}
          GITMIND_TOKEN: ${{ secrets.GITMIND_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          RESPONSE=$(curl -sf -X POST "$GITMIND_API_URL/analyze" \
            -H "Content-Type: application/json" \
            -H "X-GH-Token: $GITMIND_TOKEN" \
            -d "{\"repo_url\": \"$REPO_URL\", \"gh_token\": \"$GITMIND_TOKEN\"}" || echo '{"error":"request failed"}')

          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            echo "::error::Failed to trigger analysis: $(echo "$RESPONSE" | jq -r '.error')"
            exit 1
          fi

          CACHED=$(echo "$RESPONSE" | jq -r '.cached // false')
          if [ "$CACHED" = "true" ]; then
            SESSION_ID=$(echo "$RESPONSE" | jq -r '.session_id')
          else
            TASK_ID=$(echo "$RESPONSE" | jq -r '.task_id')
            SESSION_ID=""

            for i in $(seq 1 60); do
              TASK=$(curl -sf "$GITMIND_API_URL/task/$TASK_ID" || echo '{"status":"pending"}')
              STATUS=$(echo "$TASK" | jq -r '.status')

              if [ "$STATUS" = "completed" ]; then
                SESSION_ID=$(echo "$TASK" | jq -r '.result.session_id')
                break
              elif [ "$STATUS" = "failed" ]; then
                echo "::error::Analysis failed: $(echo "$TASK" | jq -r '.error')"
                exit 1
              fi
              sleep 5
            done
          fi

          if [ -z "$SESSION_ID" ]; then
            echo "::error::Analysis timed out after 5 minutes"
            exit 1
          fi

          echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT

      - name: Get analysis results
        id: results
        env:
          GITMIND_API_URL: ${{ secrets.GITMIND_API_URL }}
          GITMIND_TOKEN: ${{ secrets.GITMIND_TOKEN }}
          SESSION_ID: ${{ steps.analyze.outputs.session_id }}
        run: |
          curl -sf "$GITMIND_API_URL/analysis/$SESSION_ID" \
            -H "X-GH-Token: $GITMIND_TOKEN" > /tmp/gitmind-results.json

          HEALTH_SCORE=$(jq -r '.health.score // "N/A"' /tmp/gitmind-results.json)
          HEALTH_GRADE=$(jq -r '.health.grade // "N/A"' /tmp/gitmind-results.json)
          SEC_COUNT=$(jq -r '.security_findings | length' /tmp/gitmind-results.json)
          CVE_COUNT=$(jq -r '.cve_findings | length' /tmp/gitmind-results.json)
          CRIT_COUNT=$(jq -r '[.security_findings[] | select(.severity == "critical")] | length' /tmp/gitmind-results.json)
          HIGH_COUNT=$(jq -r '[.security_findings[] | select(.severity == "high")] | length' /tmp/gitmind-results.json)
          REPO_NAME=$(jq -r '.repo_name // "unknown"' /tmp/gitmind-results.json)

          echo "health_score=$HEALTH_SCORE" >> $GITHUB_OUTPUT
          echo "health_grade=$HEALTH_GRADE" >> $GITHUB_OUTPUT
          echo "sec_count=$SEC_COUNT" >> $GITHUB_OUTPUT
          echo "cve_count=$CVE_COUNT" >> $GITHUB_OUTPUT
          echo "crit_count=$CRIT_COUNT" >> $GITHUB_OUTPUT
          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_ID: ${{ steps.analyze.outputs.session_id }}
          HEALTH_SCORE: ${{ steps.results.outputs.health_score }}
          HEALTH_GRADE: ${{ steps.results.outputs.health_grade }}
          SEC_COUNT: ${{ steps.results.outputs.sec_count }}
          CVE_COUNT: ${{ steps.results.outputs.cve_count }}
          CRIT_COUNT: ${{ steps.results.outputs.crit_count }}
          HIGH_COUNT: ${{ steps.results.outputs.high_count }}
          REPO_NAME: ${{ steps.results.outputs.repo_name }}
        run: |
          DASHBOARD_URL="https://gitmind-peach.vercel.app/?share=$SESSION_ID"

          COMMENT="## 🔍 GitMind Analysis — $(echo $GITHUB_SHA | head -c 7)\n\n"
          COMMENT+="**Repo:** $REPO_NAME\n"
          COMMENT+="**Health Score:** $HEALTH_SCORE/100 ($HEALTH_GRADE)\n\n"

          if [ "$CRIT_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            COMMENT+="> ⚠️ **$CRIT_COUNT critical**, **$HIGH_COUNT high** severity findings\n\n"
          fi

          # Security findings (full table)
          if [ "$SEC_COUNT" -gt 0 ]; then
            COMMENT+="### Security Findings ($SEC_COUNT)\n\n"
            COMMENT+="| Severity | Rule | File | Description |\n"
            COMMENT+="|----------|------|------|-------------|\n"

            jq -r '.security_findings[] | "| \(.severity // "unknown") | \(.rule // .check // "unknown") | \(.file // "unknown") | \(.description // .title // "-") |"' /tmp/gitmind-results.json | head -30 >> /tmp/comment.txt
            if [ "$SEC_COUNT" -gt 30 ]; then
              echo "| ... | ... | ... | *+$(($SEC_COUNT - 30)) more findings* |" >> /tmp/comment.txt
            fi
            echo "" >> /tmp/comment.txt
          fi

          # CVE findings (full table)
          if [ "$CVE_COUNT" -gt 0 ]; then
            COMMENT+="### CVE Findings ($CVE_COUNT)\n\n"
            COMMENT+="| Package | Severity | CVE | Description |\n"
            COMMENT+="|---------|----------|-----|-------------|\n"

            jq -r '.cve_findings[] | "| \(.package // "unknown") | \(.worst_severity // "unknown") | \(.cve_id // "unknown") | \(.description // "-") |"' /tmp/gitmind-results.json | head -20 >> /tmp/comment.txt
            if [ "$CVE_COUNT" -gt 20 ]; then
              echo "| ... | ... | ... | *+$(($CVE_COUNT - 20)) more CVEs* |" >> /tmp/comment.txt
            fi
            echo "" >> /tmp/comment.txt
          fi

          COMMENT+="---\n*Powered by [GitMind]($DASHBOARD_URL) — [View full report]($DASHBOARD_URL)*"

          # Write comment to file for gh
          printf "%b" "$COMMENT" > /tmp/gitmind-comment.md
          cat /tmp/comment.txt >> /tmp/gitmind-comment.md 2>/dev/null || true

          # Find existing bot comment or create new
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("## 🔍 GitMind Analysis")) | .id' 2>/dev/null | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$EXISTING" \
              -X PATCH -f body="$(cat /tmp/gitmind-comment.md)"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/gitmind-comment.md
          fi
