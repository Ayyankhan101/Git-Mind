name: GitMind Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  DASHBOARD_BASE: https://gitmind-peach.vercel.app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger + poll + fetch
        id: analyze
        env:
          GITMIND_API_URL: ${{ secrets.GITMIND_API_URL }}
          GITMIND_TOKEN: ${{ secrets.GITMIND_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          source ./scripts/ci-analyze.sh "$REPO_URL" "$GITMIND_TOKEN" "$GITMIND_API_URL"

          # Write to GITHUB_OUTPUT for later steps
          for var in ANALYSIS_SESSION_ID ANALYSIS_SCORE ANALYSIS_GRADE \
                     ANALYSIS_SEC_COUNT ANALYSIS_CVE_COUNT \
                     ANALYSIS_CRIT_COUNT ANALYSIS_HIGH_COUNT \
                     ANALYSIS_REPO_NAME ANALYSIS_CACHED; do
            val="${!var}"
            echo "${var,,}=$val" >> "$GITHUB_OUTPUT"
          done

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORE: ${{ steps.analyze.outputs.analysis_score }}
          GRADE: ${{ steps.analyze.outputs.analysis_grade }}
          SEC_COUNT: ${{ steps.analyze.outputs.analysis_sec_count }}
          CVE_COUNT: ${{ steps.analyze.outputs.analysis_cve_count }}
          CRIT_COUNT: ${{ steps.analyze.outputs.analysis_crit_count }}
          HIGH_COUNT: ${{ steps.analyze.outputs.analysis_high_count }}
          REPO_NAME: ${{ steps.analyze.outputs.analysis_repo_name }}
          SESSION_ID: ${{ steps.analyze.outputs.analysis_session_id }}
        run: |
          DASHBOARD="$DASHBOARD_BASE/?share=$SESSION_ID"
          SHA=$(echo "$GITHUB_SHA" | head -c 7)
          RESULTS="/tmp/gitmind-results.json"

          # ── Header ──────────────────────────────────────
          {
            echo "## 🔍 GitMind Analysis — $SHA"
            echo ""
            echo "**Repo:** $REPO_NAME  "
            echo "**Health:** $SCORE/100 ($GRADE)"
            if [ "$CRIT_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
              echo ""
              echo "> ⚠️ **$CRIT_COUNT critical**, **$HIGH_COUNT high** severity"
            fi
          } > /tmp/comment.md

          # ── Security findings (top 15) ─────────────────
          if [ "$SEC_COUNT" -gt 0 ]; then
            {
              echo ""
              echo "### Security Findings ($SEC_COUNT)"
              echo ""
              echo "| Severity | Rule | File | Description |"
              echo "|----------|------|------|-------------|"
              jq -r '
                .security_findings
                | sort_by(if .severity == "critical" then 0 elif .severity == "high" then 1 elif .severity == "medium" then 2 else 3 end)
                | .[:15][]
                | "| \(.severity // "?") | \(.rule // .check // "?") | \(.file // "?") | \(.description // .title // "-") |"
              ' "$RESULTS"
              if [ "$SEC_COUNT" -gt 15 ]; then
                echo "| ... | ... | ... | *+$(($SEC_COUNT - 15)) more* |"
              fi
              echo ""
            } >> /tmp/comment.md
          fi

          # ── CVE findings (top 10) ──────────────────────
          if [ "$CVE_COUNT" -gt 0 ]; then
            {
              echo "### CVE Findings ($CVE_COUNT)"
              echo ""
              echo "| Package | Severity | CVE | Description |"
              echo "|---------|----------|-----|-------------|"
              jq -r '
                .cve_findings
                | sort_by(if .worst_severity == "critical" then 0 elif .worst_severity == "high" then 1 elif .worst_severity == "medium" then 2 else 3 end)
                | .[:10][]
                | "| \(.package // "?") | \(.worst_severity // "?") | \(.cve_id // "?") | \(.description // "-") |"
              ' "$RESULTS"
              if [ "$CVE_COUNT" -gt 10 ]; then
                echo "| ... | ... | ... | *+$(($CVE_COUNT - 10)) more* |"
              fi
              echo ""
            } >> /tmp/comment.md
          fi

          echo "---" >> /tmp/comment.md
          echo "*Powered by [GitMind]($DASHBOARD) — [View full report]($DASHBOARD)*" >> /tmp/comment.md

          # ── Update existing or create new ──────────────
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("## 🔍 GitMind Analysis")) | .id' 2>/dev/null | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$EXISTING" \
              -X PATCH -f body="$(cat /tmp/comment.md)"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
          fi
