name: CI

# push-only: this repo has no fork PRs (no branch protection exists either —
# checked via `gh api .../branches/main/protection`, 403 not-available on
# this plan), and every PR here is same-repo branch->branch (develop->main).
# GitHub attaches status checks to the commit SHA, not the triggering event,
# so a push-triggered run's checks already show up on any PR containing that
# commit. A `pull_request` trigger alongside `push` for the same branches
# was firing a full second workflow run (lint + backend-tests + frontend-
# tests + frontend-smoke + security, all over again) for every commit on an
# open PR — pure duplicate GitHub Actions minutes with zero coverage gain.
on:
  push:
    branches: [main, develop]

# Cancel a run the instant a newer commit lands on the same branch — several
# rapid pushes to develop previously let every prior run bill to completion
# even though only the latest commit's result mattered.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tooling
        run: |
          pip install ruff mypy types-PyYAML types-requests -r backend/requirements.txt --break-system-packages
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Run linting
        run: |
          echo "=== Ruff check ==="
          ruff check backend/
          echo "=== Ruff format check ==="
          ruff format --check backend/
          echo "=== MyPy ==="
          mypy backend/ --ignore-missing-imports
      # Prettier gets its own step so a failed --check propagates as a job
      # failure. (In the old combined step the mid-chain `&&` failure was
      # silently swallowed by bash -e, so the gate never failed the job.)
      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}"
      # Dead-class gate: every className in src must resolve to a CSS rule.
      # Catches orphaned classes (Tailwind utilities after the import was
      # dropped, unshipped component classes) before they reach the build.
      - name: Classname audit (dead-class gate)
        working-directory: frontend
        run: python3 e2e/classname_audit.py --check

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-gitmind"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio --break-system-packages
      - name: Build and install gitmind_core
        run: |
          pip install maturin --break-system-packages
          cd ../rust-gitmind && maturin build --release
          pip install ../rust-gitmind/target/wheels/gitmind_core*.whl --break-system-packages
      - name: Run tests
        env:
          GROQ_API_KEY: gsk_test_placeholder
          GITHUB_TOKEN: gsk_test_placeholder
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: "development"
          DEBUG: "1"
        run: python -m pytest tests/ -v --tb=short
      - name: Smoke test
        env:
          CI_SMOKE: "1"
          GROQ_API_KEY: gsk_test_placeholder
          GITHUB_TOKEN: gsk_test_placeholder
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: "development"
          DEBUG: "1"
        run: python smoke_test.py

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests with coverage
        run: CI=true npx react-scripts test --coverage --watchAll=false --ci
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--openssl-legacy-provider --max-old-space-size=4096"
          CI: "true"
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 7

  frontend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--openssl-legacy-provider --max-old-space-size=4096"
          CI: "true"
      # Note: ubuntu runners have no Brave installed, so this job exercises the
      # script's bundled-Chromium fallback. Brave is used automatically when the
      # script runs locally (macOS/Linux) or via $BRAVE_PATH / --browser brave.
      #
      # Browser binary itself is cached (the slow ~100-300MB download); the
      # --with-deps apt step still runs every time since OS packages don't
      # persist across runner VMs regardless of caching, but that part is
      # fast. Pinned so the cache key can't silently serve a stale/mismatched
      # binary after a future unpinned `pip install playwright` upgrade.
      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.0-chromium-${{ runner.os }}
      - name: Install Playwright (bundled Chromium fallback)
        run: |
          pip install playwright==1.62.0 pymupdf --break-system-packages
          python -m playwright install chromium --with-deps
      - name: Run frontend smoke test
        run: python e2e/smoke_test.py --browser auto
      # PDF export regression gate: the two exports (summary / incident)
      # are generated through the real app and inspected with pymupdf —
      # every text span and drawing must stay inside the printable content
      # area (catches pdfmake tables that render wider than their declared
      # widths), Geist fonts must be embedded, and the brand accent /
      # severity chips must paint. Any drift fails the build.
      - name: Run PDF layout audit (export regression gate)
        run: python e2e/pdf_layout_audit.py --check
      # Spacing regression gate: every tab must keep its standard tab-header
      # (32px icon / 12px sub) and the shared 28px content gutter. Any drift
      # (e.g. someone reverts .sev-filter to 24px) fails the build here.
      - name: Run spacing audit (gutter/header regression gate)
        run: python e2e/spacing_audit.py --check
      # Overlap regression gate: clicking a diagram node must push the
      # canvas (flex sibling) and keep the floating control dock clear — a
      # revert to absolute overlay, or any panel/dock overlap, fails here.
      - name: Run overlap audit (node panel / dock regression gate)
        run: python e2e/overlap_probe.py --check
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-screenshots
          path: /tmp/gitmind-smoke/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Pinned instead of querying the GitHub releases API for "latest" on
      # every run: skips a network round-trip (and its rate-limit risk), and
      # a fixed version is what makes the binary cacheable below. Bump this
      # deliberately, not silently on whatever gitleaks shipped that day.
      - name: Cache gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-8.30.1-${{ runner.os }}
      - name: Install tools
        run: |
          pip install pip-audit --break-system-packages
          if [ ! -x ~/.local/bin/gitleaks ]; then
            mkdir -p ~/.local/bin
            curl -sLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
            tar -xzf gitleaks.tgz gitleaks
            mv gitleaks ~/.local/bin/
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Modern pip-audit (>=2.4) removed the --fail-on severity threshold:
      # the audit now exits 1 when ANY known vulnerability is found. Keep
      # the unpinned tool and its default fail-on-any behavior rather than
      # pinning a years-old scanner to preserve a removed flag.
      #
      # Ignored advisories (no upstream fix exists; package already at
      # latest PyPI version — re-check on every dep bump):
      #   PYSEC-2026-311  chromadb pre-auth code injection (no fixed release)
      #   PYSEC-2026-2447 diskcache unsafe pickle deserialization (no fixed release)
      - name: Scan Python dependencies
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-2447 --ignore-vuln CVE-2026-45830 --ignore-vuln CVE-2026-45831 --ignore-vuln CVE-2026-45833
      # Audit production dependencies only: react-scripts (build tool) and the
      # rest of the dev toolchain (lighthouse CI, size-limit, svgo/workbox
      # chains) carry advisories with no compatible fix (e.g. extract-zip has
      # no patched release), so a full-tree gate can never pass. Production
      # deps audit clean; dev-tooling advisories are tracked via Dependabot.
      - name: Scan npm dependencies (production)
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm audit --omit=dev --audit-level=high
      # .gitleaks.toml extends the default rules and allowlists the known
      # false positive from a minified third-party Obsidian plugin commit.
      - name: Gitleaks secret scan (full history)
        run: gitleaks detect --source . --no-banner --config .gitleaks.toml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend-tests, frontend-tests, frontend-smoke, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare HF Space (include Rust source for native module build)
        run: cp -r rust-gitmind backend/
      - name: Deploy to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --break-system-packages
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path='backend',
              repo_id='Ak001z/gitmind-backend',
              repo_type='space',
              path_in_repo='.',
              commit_message='auto-deploy from CI (${GITHUB_SHA::7})',
          )
          print('Deployed to HF Spaces')
          "
      - name: Wait for HF Space to report healthy
        run: |
          set -u
          URL="https://ak001z-gitmind-backend.hf.space/health"
          # HF Space rebuild (Docker) can take several minutes — poll rather
          # than assume the upload alone means the new revision is live.
          for i in $(seq 1 40); do
            HTTP_CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$URL" || echo "000")
            STATUS_FIELD=$(jq -r '.status // ""' /tmp/health.json 2>/dev/null || echo "")
            if [ "$HTTP_CODE" = "200" ] && [ "$STATUS_FIELD" = "ok" ]; then
              echo "Backend healthy after $((i * 15))s"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i/40: HTTP $HTTP_CODE, status=$STATUS_FIELD — retrying in 15s"
            sleep 15
          done
          echo "Backend did not report healthy within 10 minutes post-deploy"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

  deploy-frontend:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [lint, frontend-tests, frontend-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: "--openssl-legacy-provider --max-old-space-size=4096"
          CI: "true"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=gitmind-frontend --branch=${{ github.ref_name }}
          workingDirectory: frontend
