name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tooling
        run: |
          pip install ruff mypy types-PyYAML types-requests -r backend/requirements.txt --break-system-packages
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Run linting
        run: |
          echo "=== Ruff check ==="
          ruff check backend/
          echo "=== Ruff format check ==="
          ruff format --check backend/
          echo "=== MyPy ==="
          mypy backend/ --ignore-missing-imports
      # Prettier gets its own step so a failed --check propagates as a job
      # failure. (In the old combined step the mid-chain `&&` failure was
      # silently swallowed by bash -e, so the gate never failed the job.)
      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}"
      # Dead-class gate: every className in src must resolve to a CSS rule.
      # Catches orphaned classes (Tailwind utilities after the import was
      # dropped, unshipped component classes) before they reach the build.
      - name: Classname audit (dead-class gate)
        working-directory: frontend
        run: python3 e2e/classname_audit.py --check

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-gitmind"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio --break-system-packages
      - name: Build and install gitmind_core
        run: |
          pip install maturin --break-system-packages
          cd ../rust-gitmind && maturin build --release
          pip install ../rust-gitmind/target/wheels/gitmind_core*.whl --break-system-packages
      - name: Run tests
        env:
          GROQ_API_KEY: gsk_test_placeholder
          GITHUB_TOKEN: gsk_test_placeholder
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: "development"
          DEBUG: "1"
        run: python -m pytest tests/ -v --tb=short
      - name: Smoke test
        env:
          CI_SMOKE: "1"
          GROQ_API_KEY: gsk_test_placeholder
          GITHUB_TOKEN: gsk_test_placeholder
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: "development"
          DEBUG: "1"
        run: python smoke_test.py

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests with coverage
        run: CI=true npx react-scripts test --coverage --watchAll=false --ci --testPathIgnorePatterns='src/components/LandingPage\.test\.jsx' --testPathIgnorePatterns='src/App\.test\.jsx'
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--openssl-legacy-provider --max-old-space-size=4096"
          CI: "true"
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 7

  frontend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--openssl-legacy-provider --max-old-space-size=4096"
          CI: "true"
      # Note: ubuntu runners have no Brave installed, so this job exercises the
      # script's bundled-Chromium fallback. Brave is used automatically when the
      # script runs locally (macOS/Linux) or via $BRAVE_PATH / --browser brave.
      - name: Install Playwright (bundled Chromium fallback)
        run: |
          pip install playwright --break-system-packages
          python -m playwright install chromium --with-deps
      - name: Run frontend smoke test
        run: python e2e/smoke_test.py --browser auto
      # Spacing regression gate: every tab must keep its standard tab-header
      # (32px icon / 12px sub) and the shared 28px content gutter. Any drift
      # (e.g. someone reverts .sev-filter to 24px) fails the build here.
      - name: Run spacing audit (gutter/header regression gate)
        run: python e2e/spacing_audit.py --check
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-screenshots
          path: /tmp/gitmind-smoke/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend-tests, frontend-tests, frontend-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare HF Space (include Rust source for native module build)
        run: cp -r rust-gitmind backend/
      - name: Deploy to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --break-system-packages
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path='backend',
              repo_id='Ak001z/gitmind-backend',
              repo_type='space',
              path_in_repo='.',
              commit_message='auto-deploy from CI (${GITHUB_SHA::7})',
          )
          print('Deployed to HF Spaces')
          "
