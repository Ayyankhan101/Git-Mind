name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tooling
        run: |
          pip install pre-commit ruff -r backend/requirements.txt --break-system-packages
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: ESLint
        working-directory: frontend
        run: npx eslint src/

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-gitmind"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio --break-system-packages
      - name: Build and install gitmind_core
        run: |
          pip install maturin --break-system-packages
          cd ../rust-gitmind && maturin build --release
          pip install ../rust-gitmind/target/wheels/gitmind_core*.whl --break-system-packages
      - name: Run tests
        env:
          GROQ_API_KEY: gsk_test_placeholder
          GITHUB_TOKEN: gsk_test_placeholder
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DEBUG: "1"
        run: python -m pytest tests/ -v --tb=short
      - name: Smoke test
        env:
          CI_SMOKE: "1"
          GROQ_API_KEY: gsk_test_placeholder
          GITHUB_TOKEN: gsk_test_placeholder
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DEBUG: "1"
        run: python smoke_test.py

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests
        run: CI=true npx react-scripts test --watchAll=false
      - name: Build
        run: CI=true NODE_OPTIONS="--openssl-legacy-provider --max-old-space-size=4096" npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare HF Space (include Rust source for native module build)
        run: cp -r rust-gitmind backend/
      - name: Deploy to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --break-system-packages
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path='backend',
              repo_id='Ak001z/gitmind-backend',
              repo_type='space',
              path_in_repo='.',
              commit_message='auto-deploy from CI (${GITHUB_SHA::7})',
          )
          print('Deployed to HF Spaces')
          "
