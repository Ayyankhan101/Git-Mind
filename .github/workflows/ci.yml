name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages
      - name: Run tests
        env:
          GROQ_API_KEY: gsk_test_placeholder
          GITHUB_TOKEN: gsk_test_placeholder
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DEBUG: "1"
        run: python -m pytest tests/ -v --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests
        run: CI=true npx react-scripts test --watchAll=false
      - name: Build
        run: CI=true NODE_OPTIONS="--openssl-legacy-provider --max-old-space-size=4096" npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t gitmind-backend -f backend/Dockerfile backend/
      - name: Build production image
        run: docker build -t gitmind .
