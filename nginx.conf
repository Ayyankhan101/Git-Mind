events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        root /var/www/html;
        index index.html;

        # WebSocket proxy (upgrade required)
        location /ws/ {
            proxy_pass         http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 300s;
        }

        # Security headers
        add_header X-Frame-Options           "DENY"            always;
        add_header X-Content-Type-Options    "nosniff"         always;
        add_header Referrer-Policy           "strict-origin"   always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: https://api.groq.com;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API routes proxy
        location ~ ^/(chat|summary|fix|pr-review|pr-impact|org-audit|incident-report|repos|analysis|health) {
            proxy_pass       http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_read_timeout 180s;
        }

        # Frontend SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
