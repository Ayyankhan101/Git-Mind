<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animations — GitMind Midnight Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090e;
      --surface-0: #0d0e16;
      --surface-1: #11121c;
      --surface-2: #161824;
      --primary: #7c6fe0;
      --primary-hover: #8b7fe8;
      --primary-muted: rgba(124,111,224,0.15);
      --primary-subtle: rgba(124,111,224,0.08);
      --text-primary: #f0eff4;
      --text-secondary: #a8a7b3;
      --text-tertiary: #6d6c7a;
      --border-subtle: rgba(255,255,255,0.04);
      --border-default: rgba(255,255,255,0.06);
      --border-accent: rgba(124,111,224,0.25);
      --shadow-accent: 0 4px 20px rgba(124,111,224,0.2);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
      --radius-md: 10px;
      --radius-lg: 16px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --duration-fast: 120ms;
      --duration-normal: 200ms;
      --duration-slow: 350ms;
      --ease-out: cubic-bezier(0.16,1,0.3,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-secondary); padding: var(--space-xl); }
    .card { max-width: 560px; margin: 0 auto; }
    .label { font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); margin-bottom: var(--space-md); }
    .title { font-size: 1.5rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; margin-bottom: var(--space-lg); }
    .section { margin-bottom: var(--space-xl); }
    .section-title { font-size: 0.8125rem; font-weight: 500; color: var(--text-tertiary); margin-bottom: var(--space-md); letter-spacing: 0.04em; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); }
    .anim-box { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-lg); display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); }
    .anim-label { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--text-tertiary); text-align: center; }
    .demo-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); }
    .demo-square { width: 32px; height: 32px; border-radius: 6px; background: var(--primary); }
    .demo-bar { width: 48px; height: 6px; border-radius: 3px; background: var(--primary); }
    .demo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 8px var(--primary-muted); } 50% { box-shadow: 0 0 24px var(--primary-muted), 0 0 48px var(--primary-subtle); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .a-fade-in { animation: fadeIn 0.6s var(--ease-out) both; }
    .a-fade-in-up { animation: fadeInUp 0.6s var(--ease-out) both; }
    .a-slide-in { animation: slideInLeft 0.6s var(--ease-out) both; }
    .a-scale-in { animation: scaleIn 0.6s var(--ease-out) both; }
    .a-pulse { animation: pulse 2s ease-in-out infinite; }
    .a-glow { animation: glow 2s ease-in-out infinite; }
    .a-float { animation: float 3s ease-in-out infinite; }
    .a-spin { animation: spin 1.5s linear infinite; }
    .a-shimmer { background: linear-gradient(90deg, var(--surface-1) 0%, var(--primary-muted) 50%, var(--surface-1) 100%); background-size: 200% 100%; animation: shimmer 2s linear infinite; }
    .a-scanline { position: relative; overflow: hidden; }
    .a-scanline::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0%, var(--primary-subtle) 50%, transparent 100%); animation: scanline 2.5s linear infinite; pointer-events: none; }
    .a-cursor::after { content: '|'; animation: blink 1s step-end infinite; color: var(--primary); margin-left: 2px; }

    .hover-lift { transition: transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out); cursor: pointer; }
    .hover-lift:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .hover-glow { transition: box-shadow var(--duration-fast) var(--ease-out); cursor: pointer; }
    .hover-glow:hover { box-shadow: 0 0 16px var(--primary-muted), 0 0 32px var(--primary-subtle); }
    .hover-scale { transition: transform var(--duration-fast) var(--ease-out); cursor: pointer; }
    .hover-scale:hover { transform: scale(1.05); }

    .stagger-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-md); }
    .stagger-item { background: var(--primary); border-radius: 6px; height: 24px; animation: fadeInUp 0.5s var(--ease-out) both; }
    .stagger-item:nth-child(1) { animation-delay: 0ms; }
    .stagger-item:nth-child(2) { animation-delay: 60ms; }
    .stagger-item:nth-child(3) { animation-delay: 120ms; }
    .stagger-item:nth-child(4) { animation-delay: 180ms; }
    .stagger-item:nth-child(5) { animation-delay: 240ms; }
    .stagger-item:nth-child(6) { animation-delay: 300ms; }

    .code-line { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--text-secondary); padding: 4px 0; }
    .code-line .kw { color: #c4b5fd; }
    .code-line .fn { color: #93c5fd; }
    .code-line .str { color: #a5d6a7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">09 — Animations</div>
    <div class="title">Motion & Interaction</div>

    <div class="section">
      <div class="section-title">Entrance Animations</div>
      <div class="grid">
        <div class="anim-box a-fade-in">
          <div class="demo-circle"></div>
          <div class="anim-label">fadeIn</div>
        </div>
        <div class="anim-box a-fade-in-up">
          <div class="demo-square"></div>
          <div class="anim-label">fadeInUp</div>
        </div>
        <div class="anim-box a-slide-in">
          <div class="demo-bar"></div>
          <div class="anim-label">slideInLeft</div>
        </div>
        <div class="anim-box a-scale-in">
          <div class="demo-circle"></div>
          <div class="anim-label">scaleIn</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Looping Animations</div>
      <div class="grid">
        <div class="anim-box">
          <div class="demo-dot a-pulse"></div>
          <div class="anim-label">pulse</div>
        </div>
        <div class="anim-box">
          <div class="demo-square a-glow"></div>
          <div class="anim-label">glow</div>
        </div>
        <div class="anim-box">
          <div class="demo-circle a-float"></div>
          <div class="anim-label">float</div>
        </div>
        <div class="anim-box">
          <div class="demo-circle a-spin"></div>
          <div class="anim-label">spin</div>
        </div>
        <div class="anim-box">
          <div class="demo-bar a-shimmer" style="width: 64px;"></div>
          <div class="anim-label">shimmer</div>
        </div>
        <div class="anim-box a-scanline" style="height: 64px;">
          <div class="anim-label" style="position:relative;z-index:1;">scanline</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Hover Effects</div>
      <div class="grid">
        <div class="anim-box hover-lift">
          <div class="demo-square"></div>
          <div class="anim-label">hover-lift</div>
        </div>
        <div class="anim-box hover-glow">
          <div class="demo-square"></div>
          <div class="anim-label">hover-glow</div>
        </div>
        <div class="anim-box hover-scale">
          <div class="demo-square"></div>
          <div class="anim-label">hover-scale</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Stagger Cascade</div>
      <div class="stagger-grid">
        <div class="stagger-item"></div>
        <div class="stagger-item"></div>
        <div class="stagger-item"></div>
        <div class="stagger-item"></div>
        <div class="stagger-item"></div>
        <div class="stagger-item"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Typing Cursor</div>
      <div class="anim-box" style="align-items: flex-start; padding: var(--space-lg);">
        <div class="code-line"><span class="kw">const</span> <span class="fn">scan</span> = <span class="kw">async</span> (repo) => {<span class="a-cursor"></span></div>
      </div>
    </div>
  </div>
</body>
</html>
