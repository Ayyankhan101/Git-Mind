<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigation — GitMind Midnight Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090e;
      --surface-0: #0d0e16;
      --surface-1: #11121c;
      --surface-2: #161824;
      --primary: #7c6fe0;
      --primary-muted: rgba(124,111,224,0.15);
      --text-primary: #f0eff4;
      --text-secondary: #a8a7b3;
      --text-tertiary: #6d6c7a;
      --border-subtle: rgba(255,255,255,0.04);
      --border-default: rgba(255,255,255,0.06);
      --border-accent: rgba(124,111,224,0.25);
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
      --radius-md: 10px;
      --radius-lg: 16px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --duration-fast: 120ms;
      --ease-out: cubic-bezier(0.16,1,0.3,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-secondary); padding: var(--space-xl); }
    .card { max-width: 560px; margin: 0 auto; }
    .label { font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); margin-bottom: var(--space-md); }
    .title { font-size: 1.5rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; margin-bottom: var(--space-lg); }
    .nav-preview { background: var(--surface-0); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-lg); display: flex; gap: var(--space-xl); }
    .nav-rail { width: 64px; background: var(--surface-1); border-radius: var(--radius-md); padding: var(--space-sm); display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item { width: 44px; height: 44px; min-height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); transition: all var(--duration-fast) var(--ease-out); cursor: pointer; }
    .nav-item:hover { background: var(--surface-2); color: var(--text-secondary); }
    .nav-item.active { background: var(--primary-muted); color: var(--primary); box-shadow: inset 0 0 0 1px var(--border-accent); }
    .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .nav-content { flex: 1; background: var(--surface-1); border-radius: var(--radius-md); padding: var(--space-lg); }
    .nav-content-title { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-sm); }
    .nav-content-text { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">06 — Navigation</div>
    <div class="title">Nav Rail + Content</div>
    <div class="nav-preview">
      <div class="nav-rail">
        <div class="nav-item active" title="Summary"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
        <div class="nav-item" title="Diagram"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></div>
        <div class="nav-item" title="Security"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5.5-3.8 10-8 11-4.2-1-8-5.5-8-11V6l8-4z"/></svg></div>
        <div class="nav-item" title="Chat"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
        <div class="nav-item" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
      </div>
      <div class="nav-content">
        <div class="nav-content-title">Summary Dashboard</div>
        <div class="nav-content-text">Overview of repository health, security findings, and architectural analysis. Real-time metrics update as new commits are pushed.</div>
      </div>
    </div>
  </div>
</body>
</html>
