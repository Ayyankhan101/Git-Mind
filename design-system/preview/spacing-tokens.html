<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spacing & Elevation — GitMind Midnight Studio</title>
  <style>
    :root {
      --bg: #08090e;
      --surface-0: #0d0e16;
      --surface-1: #11121c;
      --surface-2: #161824;
      --primary: #7c6fe0;
      --text-primary: #f0eff4;
      --text-secondary: #a8a7b3;
      --text-tertiary: #6d6c7a;
      --border-subtle: rgba(255,255,255,0.04);
      --border-default: rgba(255,255,255,0.06);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --shadow-accent: 0 4px 20px rgba(124,111,224,0.2);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 999px;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text-secondary); padding: var(--space-xl); }
    .card { max-width: 480px; margin: 0 auto; }
    .label { font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); margin-bottom: var(--space-md); }
    .title { font-size: 1.5rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; margin-bottom: var(--space-lg); }
    .section { margin-bottom: var(--space-xl); }
    .section-title { font-size: 0.8125rem; font-weight: 500; color: var(--text-tertiary); margin-bottom: var(--space-md); letter-spacing: 0.04em; }
    .spacing-row { display: flex; align-items: center; gap: var(--space-md); padding: 6px 0; }
    .spacing-bar { height: 8px; background: var(--primary); border-radius: 2px; opacity: 0.6; }
    .spacing-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-tertiary); min-width: 80px; }
    .spacing-value { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); min-width: 50px; }
    .shadow-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); }
    .shadow-box { height: 64px; background: var(--surface-2); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.6875rem; color: var(--text-tertiary); }
    .radius-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-md); }
    .radius-box { height: 48px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.6875rem; color: var(--text-tertiary); }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">05 — Tokens</div>
    <div class="title">Spacing & Elevation</div>

    <div class="section">
      <div class="section-title">Spacing Scale</div>
      <div class="spacing-row"><span class="spacing-label">--space-xs</span><div class="spacing-bar" style="width:4px"></div><span class="spacing-value">4px</span></div>
      <div class="spacing-row"><span class="spacing-label">--space-sm</span><div class="spacing-bar" style="width:8px"></div><span class="spacing-value">8px</span></div>
      <div class="spacing-row"><span class="spacing-label">--space-md</span><div class="spacing-bar" style="width:16px"></div><span class="spacing-value">16px</span></div>
      <div class="spacing-row"><span class="spacing-label">--space-lg</span><div class="spacing-bar" style="width:24px"></div><span class="spacing-value">24px</span></div>
      <div class="spacing-row"><span class="spacing-label">--space-xl</span><div class="spacing-bar" style="width:32px"></div><span class="spacing-value">32px</span></div>
      <div class="spacing-row"><span class="spacing-label">--space-2xl</span><div class="spacing-bar" style="width:48px"></div><span class="spacing-value">48px</span></div>
      <div class="spacing-row"><span class="spacing-label">--space-3xl</span><div class="spacing-bar" style="width:64px"></div><span class="spacing-value">64px</span></div>
    </div>

    <div class="section">
      <div class="section-title">Radii</div>
      <div class="radius-grid">
        <div class="radius-box" style="border-radius:var(--radius-sm)">sm</div>
        <div class="radius-box" style="border-radius:var(--radius-md)">md</div>
        <div class="radius-box" style="border-radius:var(--radius-lg)">lg</div>
        <div class="radius-box" style="border-radius:var(--radius-xl)">xl</div>
        <div class="radius-box" style="border-radius:var(--radius-full)">full</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Elevation</div>
      <div class="shadow-grid">
        <div class="shadow-box" style="box-shadow:var(--shadow-sm)">sm</div>
        <div class="shadow-box" style="box-shadow:var(--shadow-md)">md</div>
        <div class="shadow-box" style="box-shadow:var(--shadow-lg)">lg</div>
        <div class="shadow-box" style="box-shadow:var(--shadow-accent)">accent</div>
      </div>
    </div>
  </div>
</body>
</html>
